<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Chicken</title>

  <!-- คำบรรยายและรูปภาพแสดงผลเวลาแชร์ลิงก์ -->
  <meta name="description" content="แอปบันทึกรายรับรายจ่าย กิจกรรมเลี้ยงไก่ไข่">
  <meta property="og:title" content="Chicken">
  <meta property="og:description" content="แอปบันทึกรายรับรายจ่าย กิจกรรมเลี้ยงไก่ไข่">
  <meta property="og:image" content="https://i.postimg.cc/V6DPphnK/chicken.png">
  <meta property="og:type" content="website">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Chicken">
  <meta name="twitter:description" content="แอปบันทึกรายรับรายจ่าย กิจกรรมเลี้ยงไก่ไข่">
  <meta name="twitter:image" content="https://i.postimg.cc/V6DPphnK/chicken.png">

  <!-- Favicon & PWA Icons -->
  <link rel="icon" type="image/png" href="https://i.postimg.cc/V6DPphnK/chicken.png">
  <link rel="shortcut icon" type="image/png" href="https://i.postimg.cc/V6DPphnK/chicken.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FFF9C4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Chicken">
  <link rel="apple-touch-icon" href="https://i.postimg.cc/V6DPphnK/chicken.png">
  <link rel="apple-touch-icon" sizes="152x152" href="https://i.postimg.cc/V6DPphnK/chicken.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://i.postimg.cc/V6DPphnK/chicken.png">

  <!-- โหลดฟอนต์ Mali สำหรับ UI ระบบ และ Sarabun สำหรับพิมพ์รายงานเอกสารทางการ -->
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@300;500;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Font Mali ทั้งเว็บ */
    body {
      font-family: 'Mali', cursive;
      margin: 0; padding: 0;
      background: linear-gradient(180deg, #FFF9C4 0%, #FFECB3 100%);
      color: #5D4037;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    /* กล่องหลัก */
    .main-card {
      background: rgba(255, 255, 255, 0.85); /* ปรับความทึบนิดหน่อยให้อ่านง่าย */
      backdrop-filter: blur(10px);
      border-radius: 30px;
      padding: 30px 20px;
      width: 85%; max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(93, 64, 55, 0.1);
      border: 2px solid white;
      position: relative; /* เพื่อให้อ้างอิงตำแหน่งปุ่มได้ */
      box-sizing: border-box;
    }

    /* แก้ไขหัวข้อ: เพิ่ม Line-height ไม่ให้ซ้อนกัน */
    h2 { 
      margin: 0 0 15px 0; 
      color: #F57F17; 
      font-size: 1.3rem; 
      font-weight: 700;
      line-height: 1.6; /* เพิ่มระยะห่างระหว่างบรรทัด */
    }

    /* การ์ดยอดเงินคงเหลือ */
    .balance-card {
      background: #FFFDE7;
      border: 2px dashed #FBC02D;
      border-radius: 20px;
      padding: 15px;
      margin: 15px 0 25px 0;
    }
    .balance-label { font-size: 0.9rem; color: #888; }
    .balance-value { font-size: 2.2rem; font-weight: 700; color: #333; margin-top: 5px; }

    /* Input Fields */
    input#amount {
      width: 100%; padding: 10px; border: none; border-bottom: 3px solid #FFD54F;
      background: transparent;
      font-family: 'Mali', cursive;
      font-size: 3rem; font-weight: bold; color: #F57F17;
      text-align: center; outline: none; margin-bottom: 20px;
      box-sizing: border-box;
    }
    input#amount::placeholder { color: #E0E0E0; }

    select, input[type="text"], input[type="number"], input[type="month"] {
      width: 100%; padding: 15px; border: none; border-radius: 15px;
      background: #fff; 
      font-family: 'Mali', cursive; font-size: 1rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      outline: none; margin-bottom: 10px; box-sizing: border-box;
      color: #5D4037;
    }

    /* ปุ่มกด */
    .btn-container { display: flex; gap: 15px; margin-top: 15px; }
    .btn {
      flex: 1; padding: 15px; border: none; border-radius: 20px;
      font-family: 'Mali', cursive; font-size: 1.2rem; font-weight: 700;
      cursor: pointer; color: white;
      transition: transform 0.2s;
      box-shadow: 0 5px 0 rgba(0,0,0,0.1);
    }
    .btn:active { transform: translateY(4px); box-shadow: none; }
    .btn-income { background: #8BC34A; }
    .btn-expense { background: #FF7043; }

    /* ปุ่มด้านบน: ปุ่มพิมพ์รายงาน (ซ้าย) และปุ่มประวัติ (ขวา) */
    .print-btn-small {
      position: absolute;
      top: 15px; left: 15px;
      background: #fff; border: 2px solid #FFF176;
      width: 40px; height: 40px; border-radius: 50%;
      font-size: 1.2rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      z-index: 10;
      transition: transform 0.2s;
    }
    .print-btn-small:active { transform: scale(0.92); }

    .history-btn-small {
      position: absolute;
      top: 15px; right: 15px;
      background: #fff; border: 2px solid #FFF176;
      width: 40px; height: 40px; border-radius: 50%;
      font-size: 1.2rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      z-index: 10;
      transition: transform 0.2s;
    }
    .history-btn-small:active { transform: scale(0.92); }

    /* Slide Sheet (ประวัติ) */
    #history-sheet {
      position: fixed; bottom: -100%; left: 0; width: 100%; height: 70vh;
      background: white; border-radius: 30px 30px 0 0;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.1);
      transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 1000; display: flex; flex-direction: column;
      font-family: 'Mali', cursive;
    }
    .sheet-header { padding: 20px; text-align: center; font-weight: bold; border-bottom: 1px dashed #eee; font-size: 1.2rem; position: relative;}
    .close-sheet { position: absolute; right: 20px; top: 20px; cursor: pointer; color: #ccc; }
    .sheet-content { padding: 20px; overflow-y: auto; flex: 1; }

    .history-item {
      background: #FAFAFA; padding: 15px; border-radius: 15px; margin-bottom: 10px;
      display: flex; justify-content: space-between; align-items: center;
      border-left: 5px solid #ddd;
    }
    
    /* Modal ต่างๆ */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.3); backdrop-filter: blur(3px);
      display: none; justify-content: center; align-items: center; z-index: 2000;
    }
    .modal-box {
      background: white; padding: 25px 20px; border-radius: 30px; width: 85%; max-width: 320px;
      text-align: center; font-family: 'Mali', cursive;
      animation: popUp 0.3s;
      box-sizing: border-box;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
    }
    @keyframes popUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .loader { display: none; margin: 10px auto; width: 30px; height: 30px; border: 4px solid #fff; border-top: 4px solid #FBC02D; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* ปฏิทินแบบใสทับ ไม่ให้เห็นไอคอนเกะกะ */
    #print-c-day::-webkit-calendar-picker-indicator {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer;
    }

    .modal-action-btn {
      padding: 12px 15px;
      border: none;
      border-radius: 15px;
      font-family: 'Mali', cursive;
      font-size: 0.95rem;
      font-weight: 700;
      color: white;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(0,0,0,0.08);
      white-space: nowrap;
      transition: transform 0.15s;
    }
    .modal-action-btn:active { transform: translateY(2px); box-shadow: none; }
  </style>
</head>
<body>

  <div class="main-card">
    <!-- ปุ่มพิมพ์รายงาน (ซ้าย) และ ปุ่มประวัติ (ขวา) -->
    <div class="print-btn-small" onclick="openPrintModal()" title="พิมพ์รายงานบัญชี">🖨️</div>
    <div class="history-btn-small" onclick="toggleHistory()" title="ประวัติรายการ">📜</div>

    <h2>บัญชีรายรับ-รายจ่าย<br>โครงการเลี้ยงไก่ไข่ 🐣</h2>

    <div class="balance-card">
      <div class="balance-label">ยอดเงินคงเหลือ</div>
      <div class="balance-value" id="total-balance">...</div>
    </div>

    <input type="number" id="amount" placeholder="0" inputmode="decimal" min="1">

    <select id="noteSelect" onchange="checkOtherOption()">
      <option value="" disabled selected>เลือกรายการ...</option>
      <option value="อื่นๆ">✏️ อื่นๆ (ระบุเอง)</option>
    </select>
    <input type="text" id="noteInput" placeholder="ระบุรายการ..." style="display:none;">

    <div class="btn-container">
      <button class="btn btn-income" onclick="prepareSubmit('รายรับ')">รับเงิน</button>
      <button class="btn btn-expense" onclick="prepareSubmit('รายจ่าย')">จ่ายเงิน</button>
    </div>
    
    <div id="loader" class="loader"></div>
  </div>

  <!-- Slide Sheet ประวัติ -->
  <div id="history-sheet">
    <div class="sheet-header">
      ประวัติ 5 รายการล่าสุด
      <span class="close-sheet" onclick="toggleHistory()">✖</span>
    </div>
    <div class="sheet-content" id="history-list">
      <div style="text-align:center; color:#ccc; margin-top:20px;">กำลังโหลด...</div>
    </div>
  </div>

  <!-- Modal ยืนยันข้อมูล -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal-box">
      <h3>ยืนยันข้อมูล</h3>
      <div style="text-align:left; background:#FFFDE7; padding:15px; border-radius:15px; margin:15px 0; color:#555;" id="confirmText"></div>
      <div class="btn-container" style="margin-top:0;">
        <button class="btn" style="background:#eee; color:#555; box-shadow:none;" onclick="closeModal('confirmModal')">แก้ก่อน</button>
        <button class="btn" style="background:#8BC34A; box-shadow:none;" onclick="submitData()">ตกลง</button>
      </div>
    </div>
  </div>

  <!-- 🖨️ Modal กำหนดช่วงเวลาพิมพ์รายงานบัญชี -->
  <div class="modal-overlay" id="printModal">
    <div class="modal-box">
      <h3 style="margin-top:0; color:#F57F17; font-size:1.15rem;">🖨️ กำหนดช่วงเวลาพิมพ์รายงาน</h3>

      <!-- 1. พิมพ์รายวัน (แบบเลือกวันเดือนปี พ.ศ.) -->
      <div style="display:flex; gap:6px; margin-bottom:10px; align-items:center;">
        <div style="position:relative; flex:1; display:flex; align-items:center;">
          <input type="text" id="print-c-day-display" readonly placeholder="วว/ดด/ปปปป (พ.ศ.)" style="padding:10px; font-size:0.85rem; width:100%; cursor:pointer; text-align:center; background:#FFFDE7; margin-bottom:0; border:1px solid #FFE082;" onclick="openPrintCalendar()" title="คลิกเพื่อเลือกวันที่">
          <input type="date" id="print-c-day" style="position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer;" onchange="onPrintDateChange(this.value)">
        </div>
        <button class="modal-action-btn" style="background:#8BC34A;" onclick="triggerPrintCustom('day')">พิมพ์รายวัน</button>
      </div>

      <!-- 2. พิมพ์รายเดือน -->
      <div style="display:flex; gap:6px; margin-bottom:10px; align-items:center;">
        <input type="month" id="print-c-month" style="padding:10px; font-size:0.85rem; flex:1; cursor:pointer; margin-bottom:0; background:#FFFDE7; border:1px solid #FFE082;" onclick="try{this.showPicker()}catch(e){}">
        <button class="modal-action-btn" style="background:#FFA726;" onclick="triggerPrintCustom('month')">พิมพ์รายเดือน</button>
      </div>

      <!-- 3. พิมพ์รายปี -->
      <div style="display:flex; gap:6px; margin-bottom:10px; align-items:center;">
        <input type="number" id="print-c-year" placeholder="พิมพ์ปี พ.ศ. (เช่น 2569)" style="padding:10px; font-size:0.85rem; flex:1; margin-bottom:0; background:#FFFDE7; border:1px solid #FFE082;">
        <button class="modal-action-btn" style="background:#42A5F5;" onclick="triggerPrintCustom('year')">พิมพ์รายปี</button>
      </div>

      <!-- 4. พิมพ์ทั้งหมด -->
      <button class="modal-action-btn" style="width:100%; margin-top:5px; background:#7E57C2; font-size:0.95rem; padding:11px;" onclick="triggerPrintCustom('all')">📄 พิมพ์ข้อมูลทั้งหมด</button>

      <!-- ปุ่มปิดหน้าต่าง -->
      <button class="btn" style="width:100%; margin-top:10px; background:transparent; border:1px solid #E0E0E0; color:#888; box-shadow:none; padding:10px; font-size:0.9rem;" onclick="closeModal('printModal')">ปิดหน้าต่าง</button>
    </div>
  </div>

  <script>
    // ลงทะเบียน Service Worker สำหรับ PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    // ============================================================
    // API Bridge: เชื่อมต่อ Google Apps Script เมื่อรันบน GitHub Pages
    // ============================================================
    let GAS_URL = localStorage.getItem('chicken_gas_url') || "";

    function getGasUrl() {
      if (!GAS_URL || GAS_URL === "YOUR_GAS_URL_HERE") {
        const input = prompt("🐣 กรุณากรอก Web App URL ของ Google Apps Script (เช่น https://script.google.com/macros/s/.../exec):");
        if (input && input.trim()) {
          GAS_URL = input.trim();
          localStorage.setItem('chicken_gas_url', GAS_URL);
        }
      }
      return GAS_URL;
    }

    function createGasProxy(successFn, failureFn) {
      const runner = {
        successFn: successFn || function() {},
        failureFn: failureFn || function(err) {
          console.warn("GAS Warning:", err);
          const loader = document.getElementById('loader');
          if (loader) loader.style.display = 'none';
        },
        withSuccessHandler: function(fn) {
          return createGasProxy(fn, this.failureFn);
        },
        withFailureHandler: function(fn) {
          return createGasProxy(this.successFn, fn);
        }
      };

      return new Proxy(runner, {
        get: function(target, prop) {
          if (prop in target) return target[prop];
          return function(...args) {
            const url = getGasUrl();
            if (!url) {
              const loader = document.getElementById('loader');
              if (loader) loader.style.display = 'none';
              target.failureFn(new Error("ยังไม่ได้ระบุ Web App URL"));
              return;
            }

            const encodedArgs = encodeURIComponent(JSON.stringify(args));
            const getUrl = `${url}?action=${encodeURIComponent(prop)}&args=${encodedArgs}`;

            fetch(getUrl)
              .then(res => {
                if (!res.ok) throw new Error("HTTP " + res.status);
                return res.json();
              })
              .then(data => {
                const loader = document.getElementById('loader');
                if (loader) loader.style.display = 'none';
                if (data && data.error) {
                  target.failureFn(new Error(data.error));
                } else {
                  target.successFn(data);
                }
              })
              .catch(err => {
                fetch(url, {
                  method: "POST",
                  headers: { "Content-Type": "text/plain;charset=utf-8" },
                  body: JSON.stringify({ action: prop, args: args })
                })
                .then(res => res.json())
                .then(data => {
                  const loader = document.getElementById('loader');
                  if (loader) loader.style.display = 'none';
                  if (data && data.error) {
                    target.failureFn(new Error(data.error));
                  } else {
                    target.successFn(data);
                  }
                })
                .catch(postErr => {
                  const loader = document.getElementById('loader');
                  if (loader) loader.style.display = 'none';
                  target.failureFn(postErr);
                });
              });
          };
        }
      });
    }

    if (!window.google || !window.google.script || !window.google.script.run) {
      window.google = window.google || {};
      window.google.script = window.google.script || {};
      window.google.script.run = createGasProxy();
    }

    let currentType = "";

    // โหลดข้อมูลเมื่อเปิดเว็บ
    window.onload = function() {
      console.log("App Started");
      google.script.run
        .withSuccessHandler(updateUI)
        .withFailureHandler(function(err){ alert("โหลดข้อมูลไม่สำเร็จ: " + err); })
        .getDashboardData();
    };

    function checkOtherOption() {
      const select = document.getElementById('noteSelect');
      const input = document.getElementById('noteInput');
      if (select.value === 'อื่นๆ') {
        input.style.display = 'block'; input.focus();
      } else {
        input.style.display = 'none';
      }
    }

    function prepareSubmit(type) {
      const amount = document.getElementById('amount').value;
      const select = document.getElementById('noteSelect');
      const input = document.getElementById('noteInput');
      let note = select.value === 'อื่นๆ' ? input.value : select.value;

      if (!amount || isNaN(amount)) { alert("กรุณากรอกตัวเลข"); return; }
      if (parseFloat(amount) <= 0) { alert("จำนวนเงินต้องมากกว่า 0 นะครับ"); return; }
      if (!note) { alert("กรุณาระบุรายการ"); return; }

      currentType = type;
      document.getElementById('confirmText').innerHTML = `
        <div style="margin-bottom:5px;"><strong>${type}</strong></div>
        <div style="font-size:1.5rem; color:${type==='รายรับ'?'#8BC34A':'#FF7043'}"><strong>${parseFloat(amount).toLocaleString()}</strong> บาท</div>
        <div style="font-size:0.9rem;">${note}</div>
      `;
      document.getElementById('confirmModal').style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function submitData() {
      closeModal('confirmModal');
      document.getElementById('loader').style.display = 'block';
      
      const amount = document.getElementById('amount').value;
      const select = document.getElementById('noteSelect');
      const input = document.getElementById('noteInput');
      let note = select.value === 'อื่นๆ' ? input.value : select.value;

      google.script.run.withSuccessHandler(function(data) {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('amount').value = "";
        document.getElementById('noteSelect').selectedIndex = 0;
        document.getElementById('noteInput').style.display = "none";
        
        updateUI(data);
        alert("บันทึกเสร็จแล้วจ้า! 🎉"); 
      }).withFailureHandler(function(err) {
        document.getElementById('loader').style.display = 'none';
        alert("เกิดข้อผิดพลาดในการบันทึก: " + err);
      }).saveDataAndGetDashboard(currentType, amount, note);
    }

    function updateUI(data) {
      // 1. อัปเดตยอดคงเหลือ
      const totalEl = document.getElementById('total-balance');
      const totalVal = data && data.total !== undefined ? data.total : 0;
      totalEl.innerText = parseFloat(totalVal).toLocaleString();
      totalEl.style.color = totalVal >= 0 ? '#333' : '#FF5252';

      // 2. อัปเดตตัวเลือก Dropdown (Setting)
      if (data && data.dropdownOptions && data.dropdownOptions.length > 0) {
        const select = document.getElementById('noteSelect');
        if (select.options.length <= 2) {
          const currentVal = select.value;
          let optsHtml = '<option value="" disabled selected>เลือกรายการ...</option>';
          data.dropdownOptions.forEach(opt => {
            optsHtml += `<option value="${opt}">${opt}</option>`;
          });
          optsHtml += '<option value="อื่นๆ">✏️ อื่นๆ (ระบุเอง)</option>';
          select.innerHTML = optsHtml;
          if (currentVal) select.value = currentVal;
        }
      }

      // 3. อัปเดตประวัติ
      const list = document.getElementById('history-list');
      
      if (!data || !data.recent || data.recent.length === 0) {
        list.innerHTML = '<div style="text-align:center; color:#ccc; margin-top:20px;">ยังไม่มีรายการจ้า</div>';
        return;
      }

      let html = '';
      data.recent.forEach(item => {
        const color = item.type === 'รายรับ' ? '#8BC34A' : '#FF7043'; 
        
        html += `
          <div class="history-item" style="border-left-color: ${color}">
            <div style="flex:1;">
              <div style="font-weight:bold; font-size:1.1rem; color:${color}">
                 ${item.type==='รายรับ' ? '+' : '-'} ${parseFloat(item.amount).toLocaleString()}
              </div>
              <div style="font-size:0.9rem; color:#555;">${item.note} <span style="font-size:0.8rem; color:#aaa;">(${item.dateStr})</span></div>
            </div>
            <button onclick="deleteItem(${item.rowNumber})" style="background:none; border:none; font-size:1.2rem; opacity:0.6; cursor:pointer;">🗑️</button>
          </div>
        `;
      });
      list.innerHTML = html;
    }

    function deleteItem(rowNumber) {
      if(!confirm("ลบรายการนี้จริงๆ เหรอ?")) return;
      document.getElementById('loader').style.display = 'block';
      google.script.run.withSuccessHandler(function(data) {
        document.getElementById('loader').style.display = 'none';
        updateUI(data);
      }).withFailureHandler(function(err) {
        document.getElementById('loader').style.display = 'none';
        alert("เกิดข้อผิดพลาดในการลบ: " + err);
      }).deleteAndGetDashboard(rowNumber);
    }

    function toggleHistory() {
      const sheet = document.getElementById('history-sheet');
      if (sheet.style.bottom === '0px') {
        sheet.style.bottom = '-100%';
      } else {
        sheet.style.bottom = '0px';
      }
    }

    // ============================================================
    // ระบบพิมพ์รายงานบัญชี (Print Report System)
    // ============================================================
    function openPrintModal() {
      document.getElementById('printModal').style.display = 'flex';
      // ตั้งค่าเริ่มต้นวันที่เป็นวันปัจจุบัน
      const today = new Date();
      const y = today.getFullYear();
      const m = (today.getMonth() + 1).toString().padStart(2, '0');
      const d = today.getDate().toString().padStart(2, '0');
      const yBE = y + 543;
      
      const dayInput = document.getElementById('print-c-day');
      const dayDisplay = document.getElementById('print-c-day-display');
      if (dayInput && !dayInput.value) {
        dayInput.value = `${y}-${m}-${d}`;
        if (dayDisplay) dayDisplay.value = `${d}/${m}/${yBE}`;
      }
      
      const monthInput = document.getElementById('print-c-month');
      if (monthInput && !monthInput.value) {
        monthInput.value = `${y}-${m}`;
      }
      
      const yearInput = document.getElementById('print-c-year');
      if (yearInput && !yearInput.value) {
        yearInput.value = yBE;
      }
    }

    function openPrintCalendar() {
      const el = document.getElementById('print-c-day');
      if (el) {
        if (typeof el.showPicker === 'function') {
          try { el.showPicker(); return; } catch(e) {}
        }
        el.focus();
        el.click();
      }
    }

    function onPrintDateChange(val) {
      const display = document.getElementById('print-c-day-display');
      if (!val) { if (display) display.value = ''; return; }
      const parts = val.split('-');
      if (parts.length === 3) {
        let y = parseInt(parts[0], 10);
        let yBE = y > 2400 ? y : y + 543;
        let m = parts[1].padStart(2, '0');
        let d = parts[2].padStart(2, '0');
        if (display) display.value = `${d}/${m}/${yBE}`;
      }
    }

    function triggerPrintCustom(type) {
      let val = ""; 
      let rangeText = "";

      if (type === 'day') {
        val = document.getElementById('print-c-day').value;
        if (!val && document.getElementById('print-c-day-display')) {
          let disp = document.getElementById('print-c-day-display').value.trim();
          if (disp.includes('/')) {
            let p = disp.split('/');
            if (p.length === 3) {
              let d = p[0].padStart(2, '0');
              let m = p[1].padStart(2, '0');
              let y = parseInt(p[2], 10);
              let yCE = y > 2400 ? y - 543 : y;
              val = `${yCE}-${m}-${d}`;
              document.getElementById('print-c-day').value = val;
            }
          }
        }
        if (val) {
          let p = val.split('-');
          let y = parseInt(p[0], 10);
          let yBE = y > 2400 ? y : y + 543;
          let d = p[2].padStart(2, '0');
          let m = p[1].padStart(2, '0');
          rangeText = "ประจำวันที่ " + d + "/" + m + "/" + yBE;
        }
      } else if (type === 'month') {
        val = document.getElementById('print-c-month').value;
        if (val) {
          let p = val.split('-');
          let y = parseInt(p[0], 10);
          let yBE = y > 2400 ? y : y + 543;
          rangeText = "ประจำเดือน " + p[1] + "/" + yBE;
        }
      } else if (type === 'year') {
        val = document.getElementById('print-c-year').value;
        if (val) {
          let rawY = parseInt(val, 10);
          let yBE = rawY > 2400 ? rawY : rawY + 543;
          rangeText = "ประจำปี พ.ศ. " + yBE;
        }
      } else if (type === 'all') {
        triggerPrint('all');
        return;
      }

      if (!val) { alert("⚠️ กรุณาระบุเวลาที่ต้องการพิมพ์ให้ครบถ้วน"); return; }
      triggerPrint({ type: 'custom_' + type, value: val, text: rangeText });
    }

    function triggerPrint(range) {
      document.getElementById('printModal').style.display = 'none';

      let win = window.open("", "_blank");
      if (!win) { alert("⚠️ เบราว์เซอร์บล็อกหน้าต่างพิมพ์ กรุณาอนุญาต Pop-up ก่อนครับ"); return; }
      win.document.write("<h3 style='font-family:Sarabun, sans-serif; text-align:center; padding:30px;'>⏳ กำลังดึงข้อมูลรายงาน...</h3>");

              <p style="margin-top:20px;"><button onclick="window.close()" style="padding:8px 18px; font-family:'Sarabun'; cursor:pointer;">ปิดหน้าต่าง</button></p>
            </div>`;
          return;
        }

        const thaiYear = now.getFullYear() + 543;

        const thaiDay = now.getDate().toString().padStart(2, '0');

        const thaiMinutes = now.getMinutes().toString().padStart(2, '0');

        // คำนวณยอดรวมรายรับและรายจ่าย
        let totalIncome = 0;
        let totalExpense = 0;
        data.forEach(item => {
          let amt = parseFloat(item.amount) || 0;
          if (item.type === 'รายรับ') totalIncome += amt;
          else if (item.type === 'รายจ่าย') totalExpense += amt;
        });
        let netBalance = totalIncome - totalExpense;

        let html = `<!DOCTYPE html>

      </tr>
    </thead>
    <tbody>`;

        data.forEach((r, idx) => {
          let incomeStr = r.type === 'รายรับ' ? parseFloat(r.amount).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) : '-';
          let expenseStr = r.type === 'รายจ่าย' ? parseFloat(r.amount).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) : '-';
          
          html += `<tr>

            <td style="text-align:right; ${r.type==='รายรับ'?'color:#2E7D32; font-weight:600;':''}">${incomeStr}</td>
            <td style="text-align:right; ${r.type==='รายจ่าย'?'color:#C62828; font-weight:600;':''}">${expenseStr}</td>

        html += `
